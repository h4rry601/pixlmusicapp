name: pixl
description: Music is for all

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  nes_ui: ^0.31.0
  animated_splash_screen: ^1.3.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  audio_service: ^0.18.15
  audio_session: ^0.2.4
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/images/
    - assets/images/pixl_animation.gif
    - assets/images/pixl.png

  uses-material-design: true
